spring.application.name=keuangan

# Database H2 (file-based supaya data tidak hilang saat restart).
# Untuk PostgreSQL/MySQL, ganti url, driver, username, password.
# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/keuangan
spring.datasource.username=postgres
spring.datasource.password=Kmzwa8awa
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP - default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.packages-to-scan=com.example.Keuangan.controller

# JWT Configuration
app.jwt.secret=your-super-secret-jwt-key-change-this-in-production-at-least-32-characters-long
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

